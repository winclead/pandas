<!DOCTYPE html>
<html lang="ko">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./assets/css/style.css">

<body>
    <div class="layout-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>🐼 Pandas Study</h2>
            </div>
            <nav class="nav-menu">
                <a href="./index.html" class="active">🏠 홈 (메인)</a>
                <a href="./pages/datasets.html">📂 데이터 다운로드 센터</a>

                <div class="nav-right">

                    <div class="chapter-card" onclick="location.href='./pages/01_load_data.html'">
