<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데이터 다운로드 센터 - Pandas Study</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="layout-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>🐼 Pandas Study</h2>
                <button class="close-sidebar-btn" onclick="toggleSidebar()">✕</button>
            </div>
            <div class="sidebar-search-box">
                <input type="text" id="sidebarSearch" placeholder="🔍 주제 검색..." oninput="filterSidebar()">
            </div>
            <nav class="nav-menu" id="navMenu">
                <a href="../index.html">🏠 홈 (메인)</a>
                <a href="./datasets.html" class="active">📂 데이터 다운로드 센터</a>
                <a href="./01_load_data.html">01. 데이터 로드 및 확인</a>
            </nav>
        </aside>

        <div class="main-wrapper" id="mainWrapper">
            <header class="top-navbar">
                <div class="nav-left">
                    <button class="icon-btn" onclick="toggleSidebar()">☰ 메뉴</button>
                    <div class="page-nav-btns">
                        <a href="../index.html">← 홈으로</a>
                    </div>
                </div>
                <div class="nav-right">
                    <label class="global-toggle-label">
                        <input type="checkbox" id="globalAnswerToggle" onchange="setGlobalToggle(this)"> 답안 항상 보기
                    </label>
                    <button class="icon-btn" id="themeToggleBtn" onclick="toggleTheme()">🌙 다크모드</button>
                </div>
            </header>

            <main class="main-content">
                <h1>📂 데이터 다운로드 센터</h1>
                <p>실습에 사용하는 원본 CSV 샘플 파일들을 모아두었습니다. 언제든 다운로드하여 실습해 보세요.</p>
                
                <div class="question-box">
                    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
                        <div>
                            <h3 style="margin-bottom: 4px;">1. 기본 측정 데이터 (data.csv)</h3>
                            <p style="margin: 0; font-size: 0.85rem;">[챕터 01] ID, Measurement, Status 컬럼으로 구성된 샘플 데이터</p>
                        </div>
                        <button class="toggle-btn" style="margin: 0;" onclick="downloadSampleData1()">📥 CSV 다운로드</button>
                    </div>
                    
                    <details style="margin-top: 15px;">
                        <summary style="cursor: pointer; font-size: 0.9rem; font-weight: 600; color: var(--accent);">📊 데이터 미리보기 (클릭하여 펼치기)</summary>
                        <div style="margin-top: 10px; overflow-x: auto;">
                            <table class="dataframe-table">
                                <tr><th>ID</th><th>Measurement</th><th>Status</th></tr>
                                <tr><td>101</td><td>12.45</td><td>Pass</td></tr>
                                <tr><td>102</td><td>11.80</td><td>Fail</td></tr>
                                <tr><td>103</td><td>12.10</td><td>Pass</td></tr>
                                <tr><td>104</td><td>13.02</td><td>Pass</td></tr>
                            </table>
                        </div>
                    </details>
                </div>
            </main>
        </div>
    </div>
    <script src="../assets/js/main.js"></script>
    <script>
        function downloadSampleData1() {
            const csvData = `ID,Measurement,Status\n101,12.45,Pass\n102,11.80,Fail\n103,12.10,Pass\n104,13.02,Pass`;
            downloadCSVFile('data.csv', csvData);
        }
    </script>
</body>
</html>
